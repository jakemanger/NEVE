#### STIMULI ####
## background
aboveHorizonColourR: [3] 
aboveHorizonColourG: [3]
aboveHorizonColourB: [3]
aboveHorizonColourA: 255
belowHorizonColourR: [3]
belowHorizonColourG: [3]
belowHorizonColourB: [3]
belowHorizonColourA: 255

horizonHeight: [0] ## The height of the horizon in degrees (0 is exactly horizontal relative to the eye position).
# NB For HorizonColourRGBA-Back/Left/Front/Right to work, set horizonHeight-Back/Left/Front/Right
horizonHeightFront: [0] ## The height of the horizon in degrees (0 is exactly horizontal relative to the eye position).
horizonHeightLeft: [0] ## The height of the horizon in degrees (0 is exactly horizontal relative to the eye position).
horizonHeightBack: [0] ## The height of the horizon in degrees (0 is exactly horizontal relative to the eye position).
horizonHeightRight: [0] ## The height of the horizon in degrees (0 is exactly horizontal relative to the eye position).


# OBJECT - here you can use a still object to hide the stimuli object, by putting the animal inside
  # use 'duration' to set the duration of the still object. The still object has the same brightness as the background.
autoStart: 1
stimulusType: 0 # 0 = sphere, 1 =square, 2= sphere with grating
  ## The scale of the stimulus at the start of the stimulus
startScaleX: 3 #cm
startScaleY: 3 #cm
startScaleZ: 3 #cm
  ## The scale of the stimulus at the end
endScaleX: 3 #cm
endScaleY: 3 #cm
endScaleZ: 3 #cm
  ## Stimulus polar position at start of stimulus
   # X (elevation) and Y (azimuth) are rotational axes, so X is up and down, Y is left and right. 
   # X is the equivalent of negative elevation, Y is the equivalent of azimuth.
startElevation: -40 # Default = 0 ## Can be -90 to 90
startAzimuth: 90  # Default = 0 ## Can be -180 to 180
  ## Stimulus polar position at end of stimulus
endElevation: 40
endAzimuth: 90
  ## The offset of the stimulus from the eye position in cm at the start of the loom
startDistance: 12.4 # Can be zero to 'infinity'
  ## The offset of the stimulus from the eye position in cm at the end of the loom
endDistance: 12.4 
numReps: 1 # The number of times to repeat the stimulus movement (0.5 is start-finish, 1 is start-finish-start).
delayToAppear: 0 # The delay in seconds before the stimulus object appears.
delayToApproach: 10 # The delay in seconds before the stimulus starts
hideAtEnd: 1 # 0= false, 1= true
directPath: 0 # 0= false, 1= true


#### DOCUMENTATION ####

# Below are the parameters used to alter a unity experiment where still objects,
  # snells window and bioluminenscent objects or silhouttes appears above, 
  # to the right and below at multiple light intensities.

# Each experiment should take 73 * 40 seconds = 49 minutes (with 2 repeats).
# The first and last displayed screens are completely black (for dark adaptation).
# Once you are ready to start the experiment, press escape and make sure to hide the mouse
  # in the corner of the screen (it can sometimes appear when you press escape).
# You will see the sync square in the bottom of one of the screens indicating what condition
  # is being displayed and the animal id you set in this file.
# For the first 20 seconds, a new background will be set, with a ball covering the animals
  # view in all directions. Then, the ball will dissapear revealing a snells window, bioluminenscent object
  # or silhoutte. After another 20 seconds, the next condition will be displayed.
# The order of experiment are randomised with the python part of the configuration file for you.
# Just enter the stimulus conditions you wish to use and make sure to update the n_conditions parameter in
  # python_setup.

# logs will be saved in the trial_logs/ directory with the parameters used and positional information
# each frame from unity.

# Controls for the experiment
# escape - stall Unity, end the experiment and give control to python.
# F - flicker the stimulus and the sync square to sync unity with the camera
# IF displayStimulusCode == True, then F just fades displayStimulusCode from off to on or on to off
# tab - Unlock/lock the cursor from Unity allowing you to see or not see your mouse 
# Space - start movement/reset looming of the stimulus
# IF manualControl==1,
# Move the mouse - Move the stimulus in polar coordinates around the center of the aquariums
# Scroll the mouse wheel - Make the stimulus larger or smaller
# 0 - recenter stimulus to the center of the front screen (polar coordinates: 0, 0).
