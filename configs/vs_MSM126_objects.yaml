#### PARAMETERS TO SET ####
darkAdaptTime: 0 # Dark adaptation in seconds --> 100 = ~2 min, 1000 = ~ 17 minutes
experimentDuration: 120 # Duration single stimuli in seconds = 2 min

#### SCREEN PERSPECTIVES ####
