# Below are the parameters used to alter a unity experiment with the name
# Optomotor

# each experiment should take around 18 minutes

# Controls for the experiment
# escape - stall Unity, end the experiment and give control to python.
# F - flicker the stimulus and the sync square to sync unity with the camera
# IF displayStimulusCode == True, then F just fades displayStimulusCode from off to on or on to off
# tab - Unlock/lock the cursor from Unity allowing you to see or not see your mouse 

# general
buildDir: ./builds/Optomotor/
frameDataIdCode: [1, 2, 3, 4, 5, 6, 7, 8, 9] 
animalCode: 3
execution_order: [3, 5, 5, 7, 1, 7, 7, 5, 1, 0, 4, 4, 3, 0, 1, 2, 6, 0, 3, 2, 6, 2, 6, 4]
#[1, 3, 3, 4, 0, 5, 1, 6, 4, 2, 0, 6, 6, 7, 7, 1, 2, 0, 7, 4, 5, 2, 5, 3]
#[3, 4, 7, 0, 0, 2, 1, 5, 2, 6, 1, 6, 5, 6, 7, 0, 3, 4, 5, 2, 1, 3, 7, 4]
#[3, 5, 4, 4, 0, 1, 1, 7, 6, 2, 0, 5, 6, 2, 4, 3, 6, 5, 2, 7, 0, 1, 3, 7]
#[2, 5, 3, 7, 5, 3, 4, 3, 6, 0, 5, 1, 7, 4, 6, 7, 2, 6, 0, 0, 2, 1, 4, 1]
#[3, 7, 2, 3, 4, 5, 5, 7, 1, 1, 1, 6, 6, 0, 6, 7, 0, 2, 4, 4, 5, 2, 3, 0]
#[6, 5, 3, 2, 6, 3, 5, 7, 3, 0, 5, 0, 6, 4, 4, 1, 7, 1, 4, 1, 2, 2, 7, 0]
#[5, 6, 7, 2, 0, 1, 2, 3, 1, 3, 4, 0, 5, 7, 4, 2, 7, 6, 1, 4, 3, 5, 6, 0]
#[2, 2, 5, 7, 2, 6, 3, 0, 5, 4, 4, 1, 0, 7, 1, 1, 6, 3, 0, 5, 7, 4, 6, 3]

experimentDuration: 180
reverseAfterSeconds: 30

recordFrameData: 1
recordEachFrame: 1
recordingFrequency: 1
manualControl: 0 
mouseMoveSpeed: 2 
flickerDuration: 0.1
syncSquareColourR: 0.3
syncSquareColourG: 0
syncSquareColourB: 0
syncSquareColourA: 1 
syncSquareTextColourR: 0.7
syncSquareTextColourG: 0.4
syncSquareTextColourB: 0.4
syncSquareTextColourA: 1
syncSquareDisplayNum: 1
syncSquareScalar: 2
displayStimulusCode: 1

# perspective
eyeHeight: 3.435 
distanceToMonitors: 7 
monitorDimensionsX: 12.176
monitorDimensionsY: 6.87
frontDisplayNum: 0 
rightDisplayNum: 1 
backDisplayNum: 2
leftDisplayNum: 3
darkAdaptTime: 10000

# stimuli
# change to 4 8 16
# run a experiment with 8 and 16 at different speeds first up
# we just want to get something
density: [4, 4, 4, 4, 8, 8, 8, 8]
offset: 0 
angle: 0
speed: [0.1, 0.2, 0.4, 0.8, 0.1, 0.2, 0.4, 0.8] 
square: 0
minimumVal: 0 
maximumVal: 0.078125