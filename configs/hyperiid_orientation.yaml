# Below are the parameters used to alter a unity experiment with the name
# Hyperiid orientation experiment

# runs through 6 conditions
# where snells window appears above, to the right and below at two different intensities

# each experiment should take 18 minutes

# Controls for the experiment
# escape - stall Unity, end the experiment and give control to python.
# F - flicker the stimulus and the sync square to sync unity with the camera
# IF displayStimulusCode == True, then F just fades displayStimulusCode from off to on or on to off
# tab - Unlock/lock the cursor from Unity allowing you to see or not see your mouse 
# Space - start movement/reset looming of the stimulus
# IF manualControl==1,
# Move the mouse - Move the stimulus in polar coordinates around the center of the aquariums
# Scroll the mouse wheel - Make the stimulus larger or smaller
# 0 - recenter stimulus to the center of the front screen (polar coordinates: 0, 0).

# general
buildDir: ./builds/Loom/
frameDataIdCode: [1, 2, 3, 4, 5, 6]
animalCode: 1
execution_order: [0, 1, 2, 3, 4, 5]
#[1, 4, 5, 1, 2, 0, 4, 2, 2, 0, 3, 4, 3, 5, 5, 3, 0, 1]
#[4, 2, 1, 0, 3, 0, 5, 5, 4, 1, 3, 0, 4, 2, 3, 1, 2, 5]
#[5, 1, 4, 1, 2, 3, 3, 2, 4, 0, 1, 4, 2, 3, 0, 5, 5, 0]
#[3, 1, 5, 5, 0, 1, 2, 4, 4, 2, 4, 2, 1, 0, 5, 0, 3, 3]
#[1, 0, 5, 3, 4, 3, 4, 2, 3, 0, 1, 0, 2, 5, 2, 5, 1, 4]
#[2, 3, 1, 5, 2, 1, 4, 4, 5, 2, 4, 0, 0, 3, 1, 3, 0, 5]
#[1, 1, 5, 1, 0, 0, 2, 3, 4, 4, 5, 0, 3, 4, 2, 5, 3, 2]
#[5, 2, 4, 3, 0, 1, 4, 2, 5, 1, 1, 0, 0, 2, 4, 3, 5, 3]
#[4, 1, 2, 1, 5, 2, 0, 3, 1, 5, 0, 3, 2, 4, 3, 4, 5, 0]
#[1, 3, 2, 5, 1, 3, 0, 0, 0, 4, 2, 2, 5, 3, 5, 1, 4, 4]

cameraRotationX: 90
experimentDuration: 60
recordFrameData: 1 
recordEachFrame: 1
recordingFrequency: 1 
manualControl: 0 
syncSquareColourR: 0.3
syncSquareColourG: 0
syncSquareColourB: 0
syncSquareColourA: 1
syncSquareDisplayNum: 0
syncSquareScalar: 2
displayStimulusCode: 1 
fictracFeedback: 0


# perspective
eyeHeight: 3.435 
distanceToMonitors: 7 
monitorDimensionsX: 12.176
monitorDimensionsY: 6.87
frontDisplayNum: [0, 3, 2, 0, 3, 2] 
rightDisplayNum: [1, 0, 3, 1, 0, 3] 
backDisplayNum: [2, 1, 0, 2, 1, 0]
leftDisplayNum: [3, 2, 1, 3, 2, 1]
darkAdaptTime: 10000

# stimuli
# background
aboveHorizonColourR: [0.01, 0.01, 0.01, 0.02, 0.02, 0.02]
aboveHorizonColourG: [0.01, 0.01, 0.01, 0.02, 0.02, 0.02]
aboveHorizonColourB: [0.01, 0.01, 0.01, 0.02, 0.02, 0.02]
aboveHorizonColourA: 1
belowHorizonColourR: 0
belowHorizonColourG: 0
belowHorizonColourB: 0
belowHorizonColourA: 1
horizonHeight: 41.5
# object
stimulusType: 0
startScaleX: 0  
startScaleY: 0
startScaleZ: 0
endScaleX: 0
endScaleY: 0
endScaleZ: 0  
startElevation: 15 
startAzimuth: 0  
endElevation: 15
endAzimuth: 0 
startDistance: 15
endDistance: 15 
duration: 8 
numReps: 0.5 
delayToApproach: 1005 
stimulusColourR: 0.02
stimulusColourG: 0.02
stimulusColourB: 0.02
stimulusColourA: 1