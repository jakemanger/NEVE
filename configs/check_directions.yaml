# Below are the parameters used to alter a unity experiment with the name
# Loom

# Controls for the experiment
# escape - stall Unity, end the experiment and give control to python.
# F - flicker the stimulus and the sync square to sync unity with the camera
# IF displayStimulusCode == True, then F just fades displayStimulusCode from off to on or on to off
# tab - Unlock/lock the cursor from Unity allowing you to see or not see your mouse 
# Space - start movement/reset looming of the stimulus
# IF manualControl==1,
# Move the mouse - Move the stimulus in polar coordinates around the center of the aquariums
# Scroll the mouse wheel - Make the stimulus larger or smaller
# 0 - recenter stimulus to the center of the front screen (polar coordinates: 0, 0).

# an example with three approaching looming stimuli: grey, green, blue

# general
buildDir: ./builds/Loom/
frameDataIdCode: 1
animalCode: 1
execution_order: [0]
experimentDuration: 99999 
recordFrameData: 1 
recordEachFrame: 1
recordingFrequency: 1 
manualControl: 0 
mouseMoveSpeed: 2 
flickerDuration: 0.1
syncSquareColourR: 1
syncSquareColourG: 0
syncSquareColourB: 0
syncSquareColourA: 1
syncSquareDisplayNum: 0 
displayStimulusCode: 1 
fictracFeedback: 0

# perspective
eyeHeight: 2.864 
distanceToMonitors: 27 
monitorDimensionsX: 52 
monitorDimensionsY: 32 
frontDisplayNum: 0 
rightDisplayNum: 3 
backDisplayNum: 2
leftDisplayNum: 1
darkAdaptTime: 0

# stimuli
# background
aboveHorizonColourRFront: 1
aboveHorizonColourGFront: 0
aboveHorizonColourBFront: 0
aboveHorizonColourAFront: 1
aboveHorizonColourRRight: 0
aboveHorizonColourGRight: 1
aboveHorizonColourBRight: 0
aboveHorizonColourARight: 1 
aboveHorizonColourRBack: 0
aboveHorizonColourGBack: 0
aboveHorizonColourBBack: 1
aboveHorizonColourABack: 1
aboveHorizonColourRLeft: 0.5
aboveHorizonColourGLeft: 0.5
aboveHorizonColourBLeft: 0.5
aboveHorizonColourALeft: 1

horizonHeight: -90  
horizonHeightFront: -90
horizonHeightRight: -90
horizonHeightBack: -90
horizonHeightLeft: -90
# object
stimulusType: 0
startScaleX: 0  
startScaleY: 0
startScaleZ: 0
endScaleX: 0
endScaleY: 0
endScaleZ: 0  
startElevation: 15 
startAzimuth: 0  
endElevation: 15
endAzimuth: 0 
startDistance: 100 
endDistance: 5 
duration: 8 
numReps: 0.5 
delayToApproach: 5 
stimulusColourR: 0
stimulusColourG: 0
stimulusColourB: 0
stimulusColourA: 1
drawOutline: 0
outlineType: 0
outlineWidth: 1
outlineColourR: 0
outlineColourG: 0
outlineColourB: 0
outlineColourA: 1
fixedAngularSize: 1
fixElevation: 0
minAngularAngle: -0.5
maxAngularAngle: 0.5
originX: 0 
originY: 0 
originZ: 0 
