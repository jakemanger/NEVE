# Below are the parameters used to alter a unity experiment with the name
# DualMoving

# Controls for the experiment
# escape - stall Unity, end the experiment and give control to python.
# F - flicker the stimulus and the sync square to sync unity with the camera
# IF displayStimulusCode == True, then F just fades displayStimulusCode from off to on or on to off
# tab - Unlock/lock the cursor from Unity allowing you to see or not see your mouse 
# Space - start movement/reset the position of the stimulus
# IF manualControl==1,
# Move the mouse - Move the stimulus in polar coordinates around the center of the aquariums
# Scroll the mouse wheel - Make the stimulus larger or smaller
# 0 - recenter stimulus to the center of the front screen (polar coordinates: 0, 0).

# general
buildDir: ./builds/DualLoom
frameDataIdCode: [1, 2]  # a id code representing the experiment id. used to identify which frame save data is for what experiment.
animalCode: [1, 1]  # a id code representing the animal
execution_order: [0, 1]  # 0 = first, 1 = second
experimentDuration: 99999  # total duration of the experiment (seconds). after this time (or if escape is pressed), unity will stall and give control back to python
recordFrameData: 1  # 0 = false, 1 = true. record frame and stimulus related data?
recordEachFrame: 1  # 0 = false, 1 = true. record data each frame. If false, then uses the recording frequency
recordingFrequency: 1  # only used if recordFrameData=1 and recordEachFrame=0. time in seconds to record stimulus data
manualControl: 0  # 0 = false, 1 = true. Give manual control to the user? if so, follow control the guide at the top of this script
mouseMoveSpeed: 2  # move speed of mouse if manual_control=1
flickerDuration: 0.1  # duration of flicker of sync square and stimulus when pressing f and at start of experiment
syncSquareColorR: 1
syncSquareColorG: 0
syncSquareColorB: 0
syncSquareColorA: 1
syncSquareDisplayNum: 0  # 0 = first connected display, 1 = second, and so on
displayStimulusCode: 1  # display the stimulus code at all times on the sync square? (in white) 0 = false, 1 = true

# perspective
eyeHeight: 2.864  # height of the animals eyes relative to the bottom PIXEL of the front/side monitors - used for calculating perspective (cm). This is always in the center of the monitors.
distanceToMonitors: 27  # distance from center of eye to all monitors (cm)
monitorDimensionsX: 52  # x dimensions of monitors (cm)
monitorDimensionsY: 32  # y dimensions of monitors (cm)
# WARNING unity considers display numbers from left to right
frontDisplayNum: 0  # 0 = first connected display, 1 = second, and so on
rightDisplayNum: 1  # front refers to front camera, right refers to right and so on
backDisplayNum: 2
leftDisplayNum: 3

# stimuli
darkAdaptTime: 0
aboveHorizonColourR: 0.5
aboveHorizonColourG: 0.5
aboveHorizonColourB: 0.5
aboveHorizonColourA: 1
belowHorizonColourR: 0.3
belowHorizonColourG: 0.3
belowHorizonColourB: 0.3
belowHorizonColourA: 1
horizonHeight: 0  # degrees

# sphere 1
stimulusType1: 1 # 0 = sphere, 1 = cube
startScaleX1: 5  # size of stimulus in cm (edge to edge of sphere)
startScaleY1: 2.5
startScaleZ1: 0.0001
endScaleX1: 5
endScaleY1: 2.5
endScaleZ1: 0.0001
stimulusDuration1: 5  # duration of stimulus movement (from the start to end position. NOT a whole back and forwards loop)
# WARNING polar positions are in rotation axes (so the opposite of what you would intuitively think) x = up down, y = left right
startPolarPositionX1: -15  # stimulus starting x ROTATION in polar coordinates in degrees (-90 to 90) relative to animal eye position
startPolarPositionY1: 0  # stimulus starting y ROTATION in polar coordinates in degrees (-180 to 180) relative to animal eye position
endPolarPositionX1: -15  # stimulus ending x ROTATION in polar coordinates in degrees (-90 to 90) relative to animal eye position
endPolarPositionY1: 0  # stimulus ending y ROTATION in polar coordinates in degrees (-180 to 180) relative to animal eye position
targetLocationOffsetX1: [0, 0]  # x offset for the target of a looming stimulus (cm) relative to animal eye position
targetLocationOffsetY1: [0, 0]  # y offset for the target of a looming stimulus (cm) relative to animal eye position
targetLocationOffsetZ1: [0, 0]  # z offset for the target of a looming stimulus (cm) relative to animal eye position
startOffset1: 500  # start distance of object from eye of animal (cm)
endOffset1: 1.5 # end distance of object from eye of animal after looming (cm)
numReps1: 0.5  # number of full back and fourth movements of stimulus (0.5 = start to end, 1 = start to end to start, 2 = start to end to start to end to start)
delayToApproach1: [5, 5]  # delay in seconds before stimulus starts moving (if manual_control=false)
stimulusColourR1: 0.5  # values from 0 to 1 (anything less or greater than these extremes will be rounded to 0 or 1, respectively)
stimulusColourG1: 0.5
stimulusColourB1: 0.5
stimulusColourA1: 1

# sphere 2
stimulusType2: 1 # 0 = sphere, 1 = cube
startScaleX2: 3  # size of stimulus in cm (edge to edge of sphere)
startScaleY2: 3
startScaleZ2: 0.0001
endScaleX2: 3
endScaleY2: 3
endScaleZ2: 0.0001
stimulusDuration2: 5  # duration of stimulus movement (from the start to end position. NOT a whole back and forwards loop)
# WARNING polar positions are in rotation axes (so the opposite of what you would intuitively think)  x = up down, y = left right
startPolarPositionX2: -15  # stimulus starting x position in polar coordinates in degrees (-90 to 90) relative to animal eye position
startPolarPositionY2: 0  # stimulus starting y position in polar coordinates in degrees (-180 to 180) relative to animal eye position
endPolarPositionX2: -15  # stimulus ending x position in polar coordinates in degrees (-90 to 90) relative to animal eye position
endPolarPositionY2: 0  # stimulus ending y position in polar coordinates in degrees (-180 to 180) relative to animal eye position
targetLocationOffsetX2: [0, 0]  # x offset for the target of a looming stimulus (cm) relative to animal eye position
targetLocationOffsetY2: [0, 0]  # y offset for the target of a looming stimulus (cm) relative to animal eye position
targetLocationOffsetZ2: [0, 0]  # z offset for the target of a looming stimulus (cm) relative to animal eye position
startOffset2: 500.0001  # start distance of object from eye of animal (cm)
endOffset2: 1.5001  # end distance of object from eye of animal after looming (cm)
numReps2: 0.5  # number of full back and fourth movements of stimulus (0.5 = start to end, 1 = start to end to start, 2 = start to end to start to end to start)
delayToApproach2: [5, 5]  # delay in seconds before stimulus starts moving (if manual_control=false)
stimulusColourR2: 0  # values from 0 to 1 (anything less or greater than these extremes will be rounded to 0 or 1, respectively)
stimulusColourG2: 0
stimulusColourB2: 0
stimulusColourA2: 1