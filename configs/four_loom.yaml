endAzimuth3: 0 
startDistance3: 496.9
endDistance3: 1.19
numReps3: 0.5
delayToApproach3: 5
stimulusColourR3: 0 
stimulusColourG3: 0
stimulusColourB3: 0
stimulusColourA3: 1
drawOutline3: 1
outlineType3: 1
outlineWidth3: 16.66
outlineColourR3: 0
outlineColourG3: 0
outlineColourB3: 0
outlineColourA3: 1
fixedAngularSize3: 0
fixElevation3: 0
minAngularAngle3: -1.2
maxAngularAngle3: -0.2
originX3: -3  
originY3: 0 
originZ3: 0
opaqueObject3: 1

