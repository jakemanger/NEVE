# Below are the parameters used to alter a unity experiment with the name
# DualMoving

# Controls for the experiment
# escape - stall Unity, end the experiment and give control to python.
# F - flicker the stimulus and the sync square to sync unity with the camera
# IF displayStimulusCode == True, then F just fades displayStimulusCode from off to on or on to off
# tab - Unlock/lock the cursor from Unity allowing you to see or not see your mouse 
# Space - start movement/reset the position of the stimulus
# IF manualControl==1,
# Move the mouse - Move the stimulus in polar coordinates around the center of the aquariums
# Scroll the mouse wheel - Make the stimulus larger or smaller
# 0 - recenter stimulus to the center of the front screen (polar coordinates: 0, 0).

# general
buildDir: ./builds/FourLoom
frameDataIdCode: [900001, 900002]
animalCode: [1, 2]
execution_order: [0, 1]
experimentDuration: [99999, 99999]
recordFrameData: 1
recordEachFrame: 1
recordingFrequency: 1
manualControl: 0
mouseMoveSpeed: 2
flickerDuration: 0.1
syncSquareColourR: 1
syncSquareColourG: 0
syncSquareColourB: 0
syncSquareColourA: 1
syncSquareDisplayNum: 0
displayStimulusCode: 1
fictracFeedback: 0

# perspective
eyeHeight: 2.864
distanceToMonitors: 27
monitorDimensionsX: 52
monitorDimensionsY: 32
frontDisplayNum: 0
rightDisplayNum: 1
backDisplayNum: 2
leftDisplayNum: 3

# stimuli
# background
darkAdaptTime: 0
aboveHorizonColourR: 0.5
aboveHorizonColourG: 0.5
aboveHorizonColourB: 0.5
aboveHorizonColourA: 1
belowHorizonColourR: 0.3
belowHorizonColourG: 0.3
belowHorizonColourB: 0.3
belowHorizonColourA: 1
horizonHeight: 0 

# object 1
stimulusType1: 1 # 0 = sphere, 1 = cube
startScaleX1: 100  # size of stimulus in cm (edge to edge of sphere)
startScaleY1: 3
startScaleZ1: 0.01
endScaleX1: 100
endScaleY1: 3
endScaleZ1: 0.01
duration1: 5 # 24.925 (to get 200 mm/s)
startElevation1: 15
startAzimuth1: 0 
endElevation1: 15
endAzimuth1: 0
startDistance1: 500
endDistance1: 1.5
numReps1: 0.5  
originX1: 0
originY1: 0
originZ1: 0
delayToApproach1: 5  # delay in seconds before stimulus starts moving (if manual_control=false)
stimulusColourR1: 0.5  # values from 0 to 1 (anything less or greater than these extremes will be rounded to 0 or 1, respectively)
stimulusColourG1: 0.5
stimulusColourB1: 0.5
stimulusColourA1: 1
fixedAngularSize1: 0
fixElevation1: 0
minAngularAngle1: -3.185
maxAngularAngle1: 3.185
hideAtEnd1: 1
opaqueObject1: 1

# object 2
stimulusType2: 1 # 0 = sphere, 1 = cube
startScaleX2: 3  # size of stimulus in cm (edge to edge of sphere)
startScaleY2: 3
startScaleZ2: 3
endScaleX2: 3
endScaleY2: 3
endScaleZ2: 3
duration2: 5 # 24.925 (to get 200 mm/s)
startElevation2: 15
startAzimuth2: 0 
endElevation2: 15
endAzimuth2: 0 
startDistance2: 500
endDistance2: 1.5
numReps2: 0.5  
originX2: 0 
originY2: 0
originZ2: 0
outlineType2: 1
drawOutline2: 1
outlineWidth2: 33.33
delayToApproach2: 5  # delay in seconds before stimulus starts moving (if manual_control=false)
outlineColourR2: 0
outlineColourG2: 0
outlineColourB2: 0
outlineColourA2: 1
stimulusColourR2: 0.5  
stimulusColourG2: 0.5
stimulusColourB2: 0.5
stimulusColourA2: 1
fixedAngularSize2: 0
fixElevation2: 0
minAngularAngle2: -3.185
maxAngularAngle2: 3.185
hideAtEnd2: 1
opaqueObject2: 0

# object 3
stimulusType3: 1
startScaleX3: 0.0001
